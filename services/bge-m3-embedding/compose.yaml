services:
  bge-m3-embedding:
    build:
      context: .
      dockerfile: Dockerfile
    image: structural-codes/bge-m3-embedding:step-b1
    init: true
    gpus: all
    environment:
      BGE_MODEL_NAME: ${BGE_MODEL_NAME:-BAAI/bge-m3}
      BGE_DEVICE: ${BGE_DEVICE:-cuda:0}
      BGE_MAX_LENGTH: ${BGE_MAX_LENGTH:-1024}
      BGE_MAX_BATCH_SIZE: ${BGE_MAX_BATCH_SIZE:-32}
      BGE_MAX_TEXT_CHARACTERS: ${BGE_MAX_TEXT_CHARACTERS:-100000}
      BGE_FP16: ${BGE_FP16:-true}
      HF_HOME: /models/huggingface
      HF_HUB_CACHE: /models/huggingface/hub
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - type: bind
        source: ${BGE_MODEL_CACHE:?Set BGE_MODEL_CACHE in .env}
        target: /models/huggingface
    ports:
      - "127.0.0.1:8091:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m
