name: structural-codes-chatntc

services:
  bge-m3-embedding:
    profiles:
      - semantic
    build:
      context: ../../services/bge-m3-embedding
      dockerfile: Dockerfile
    image: ${BGE_IMAGE:-structural-codes/bge-m3-embedding:step-b1}
    init: true
    restart: unless-stopped
    gpus: all
    environment:
      BGE_MODEL_NAME: BAAI/bge-m3
      BGE_DEVICE: cuda:0
      BGE_MAX_LENGTH: "1024"
      BGE_MAX_BATCH_SIZE: "32"
      BGE_MAX_TEXT_CHARACTERS: "100000"
      BGE_FP16: "true"
      HF_HOME: /models/huggingface
      HF_HUB_CACHE: /models/huggingface/hub
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - ${BGE_MODEL_CACHE:-bge-model-cache}:/models/huggingface
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  chatntc:
    build:
      context: ../..
      dockerfile: deploy/chatntc/Dockerfile
    image: ${CHATNTC_IMAGE:-structural-codes/chatntc:step-b6}
    init: true
    restart: unless-stopped
    depends_on:
      bge-m3-embedding:
        condition: service_healthy
        restart: true
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      CHATNTC_ENABLED: "true"
      # The current ChatNTC HTTP route is deliberately local/debug-only.
      # B6 binds this port to host loopback; public ingress is out of scope.
      CHATNTC_DEBUG: "true"
      CHATNTC_PROVIDER: ${CHATNTC_PROVIDER:-deepseek}
      CHATNTC_DEEPSEEK_API_KEY: ${CHATNTC_DEEPSEEK_API_KEY:-}
      CHATNTC_DEEPSEEK_MODEL: ${CHATNTC_DEEPSEEK_MODEL:-deepseek-flash}
      CHATNTC_TIMEOUT_MS: ${CHATNTC_TIMEOUT_MS:-120000}
      CHATNTC_SEMANTIC_MODE: ${CHATNTC_SEMANTIC_MODE:-off}
      CHATNTC_EMBEDDING_PROVIDER: ${CHATNTC_EMBEDDING_PROVIDER:-flagembedding-http}
      CHATNTC_EMBEDDING_URL: ${CHATNTC_EMBEDDING_URL:-http://bge-m3-embedding:8000}
      CHATNTC_SEMANTIC_INDEX_PATH: ${CHATNTC_SEMANTIC_INDEX_PATH:-/app/data/chatntc-semantic}
      CHATNTC_EMBEDDING_TIMEOUT_MS: ${CHATNTC_EMBEDDING_TIMEOUT_MS:-120000}
      CHATNTC_EMBEDDING_BATCH_SIZE: ${CHATNTC_EMBEDDING_BATCH_SIZE:-32}
    volumes:
      - ${CHATNTC_SEMANTIC_INDEX_HOST_PATH:-chatntc-semantic-index}:/app/data/chatntc-semantic:ro
    ports:
      - "127.0.0.1:${CHATNTC_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health')
          .then(response => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  bge-model-cache:
  chatntc-semantic-index:
